name: Build & Release (macOS DMG & Windows EXE)

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos:
    name: Build macOS (.dmg)
    runs-on: macos-14
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install telethon pywebview pyobjc pyinstaller

      - name: Build macOS App & DMG
        run: |
          python build_exe.py

      - name: Upload macOS DMG Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LightWidget-macOS-DMG
          path: dist/LightWidget-macOS.dmg
          if-no-files-found: error

  build-windows:
    name: Build Windows (.exe)
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install telethon pywebview pythonnet pyinstaller

      - name: Build Single-File Executable (.exe)
        run: |
          python build_exe.py

      - name: Upload Windows EXE Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LightWidget-Windows-EXE
          path: dist/LightWidget.exe
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download macOS Artifact
        uses: actions/download-artifact@v4
        with:
          name: LightWidget-macOS-DMG
          path: release_assets/

      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: LightWidget-Windows-EXE
          path: release_assets/

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "${{ github.ref_name }} / Windows (.exe) & macOS (.dmg)"
          generate_release_notes: true
          files: |
            release_assets/LightWidget-macOS.dmg
            release_assets/LightWidget.exe
          body: |
            ## ⚡ LightWidget — ${{ github.ref_name }}

            ### 📦 Скачать приложение:
            * 🍏 **macOS:** `LightWidget-macOS.dmg` (Откройте образ и перетащите `LightWidget.app` в папку «Программы»)
            * 🪟 **Windows:** `LightWidget.exe` (Портативная версия, установка не требуется)

            ---

            ### 🚀 Что нового:
            **[+] Добавлено:**
            * Система автообновлений по официальным релизам GitHub с версионным контролем
            * Интерактивный график активности электросети в стиле GitHub (18 недель)
            * Виджет суточной статистики сети за 24 часа и постоянное хранилище активности
            * Встроенный хелпер LightWidgetNotifier с фирменной иконкой для macOS уведомлений
            * Облачная синхронизация 24/7 через Render Server (`server.py`)

            **[/] Изменено/пофикшено:**
            * Двухшаговый опрос бота ДТЭК (/start -> 💡Можливі відключення)
            * Исправлена фильтрация адреса и сервисных сообщений бота
            * Принудительный показ всплывающих баннеров уведомлений macOS при активном окне
            * Адаптивный формат виджета iPhone
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

