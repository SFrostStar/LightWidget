name: Build & Release (macOS DMG & Windows EXE)

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos:
    name: Build macOS (.dmg)
    runs-on: macos-14
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install telethon pywebview pyobjc pyinstaller

      - name: Build macOS App & DMG
        run: |
          python build_exe.py

      - name: Upload macOS DMG Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LightWidget-macOS-DMG
          path: dist/LightWidget-macOS.dmg
          if-no-files-found: error

  build-windows:
    name: Build Windows (.exe)
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install telethon pywebview pythonnet pyinstaller

      - name: Build Single-File Executable (.exe)
        run: |
          python build_exe.py

      - name: Upload Windows EXE Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LightWidget-Windows-EXE
          path: dist/LightWidget.exe
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download macOS Artifact
        uses: actions/download-artifact@v4
        with:
          name: LightWidget-macOS-DMG
          path: release_assets/

      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: LightWidget-Windows-EXE
          path: release_assets/

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0
          name: "v2.0 / Windows (.exe) & macOS (.dmg)"
          body: |
            ## ⚡ LightWidget — Update 2.0

            ### 📦 Скачать приложение:
            * 🍏 **macOS:** `LightWidget-macOS.dmg` (Откройте образ и перетащите `LightWidget.app` в папку «Программы»)
            * 🪟 **Windows:** `LightWidget.exe` (Портативная версия, установка не требуется)

            ---

            ### 🚀 Что нового:
            **[+] Добавлено:**
            * Облачная синхронизация 24/7 через Render Server (`server.py`, `Dockerfile`, `Procfile`) — виджет на iPhone работает автономно без включенного ПК.
            * Встроенный механизм KeepAlive для предотвращения засыпания бесплатного сервера.
            * Надежное сквозное шифрование чувствительных данных (HMAC-SHA256).
            * Шаблон `config.example.json` для удобной и безопасной настройки.
            * Полное сохранение всех пользовательских параметров отображения и уведомлений в конфигурации.
            * Новые четкие векторные SVG-иконки разделов интерфейса.
            * Поддержка многосоставных сообщений с автоматическим выбором самого позднего времени восстановления.

            **[/] Изменено/пофикшено:**
            * Переработана логика iOS-виджета: адаптивный компактный формат (`1д 4ч 10м` ➔ `4ч 10м` ➔ `15м` ➔ `35с`).
            * Исправлена ошибка виджета iPhone, когда таймер зависал на 0 секундах или уходил в плюс вместо отображения статуса «Свет есть».
            * Исправлен кэш iOS WidgetKit с помощью анти-кэш заголовков и локального резервного кэширования.
            * Исправлен контраст элементов при выборе белого акцентного цвета (тумблеры, кнопки, бейджи шагов).
            * Убрано красное свечение за внешними границами окна приложения — фон теперь светится строго внутри контейнера.
            * Полная оптимизация и чистка всей кодовой базы проекта.

            **[-] Удалено:**
            * Удалены все отладочные комментарии и лишние пробелы из всех модулей (`app.py`, `server.py`, `core/*`, `ui/*`, `ios/*`).
            * Удалено отслеживание приватных файлов авторизации, сессий Telegram и локальных баз данных из репозитория Git.
            * Удалены эмодзи из заголовков интерфейса в пользу чистого векторного UI.
          files: |
            release_assets/LightWidget-macOS.dmg
            release_assets/LightWidget.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
