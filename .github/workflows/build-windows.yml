name: Build Windows Application (.exe)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install telethon pywebview pythonnet pyinstaller

    - name: Build Single-File Executable (.exe)
      run: |
        python build_exe.py

    - name: Upload EXE Artifact
      uses: actions/upload-artifact@v4
      with:
        name: LightWidget-Windows
        path: dist/LightWidget.exe
        if-no-files-found: error

    - name: Create or Update GitHub Release
      uses: softprops/action-gh-release@v2
      if: github.ref == 'refs/heads/main'
      with:
        tag_name: v1.0.0
        name: "LightWidget for Windows v1.0.0"
        body: |
          ### ⚡ LightWidget for Windows (Single Executable)
          
          Скачай файл `LightWidget.exe` ниже и запусти на Windows 10/11.
          Установка не требуется.
        files: dist/LightWidget.exe
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
